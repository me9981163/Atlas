name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # CLI binaries for every OS the CLI is verified on.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: atlas-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: atlas-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: atlas-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p atlas-cli
      - name: Smoke test (Unix)
        if: matrix.os != 'windows-latest'
        run: ./target/release/atlas --help
      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./target/release/atlas.exe --help
      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/release
          tar czf ${{ matrix.name }}.tar.gz atlas
          shasum -a 256 ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/release
          Compress-Archive -Path atlas.exe -DestinationPath ${{ matrix.name }}.zip
          # Standard "hash  filename" line so the checksum verifies with
          # sha256sum -c / shasum -a 256 -c like the Unix artifacts.
          $hash = (Get-FileHash ${{ matrix.name }}.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.name }}.zip" | Out-File -Encoding ascii ${{ matrix.name }}.zip.sha256
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            target/release/*.tar.gz
            target/release/*.tar.gz.sha256
            target/release/*.zip
            target/release/*.zip.sha256

  # Desktop app: packaged for Linux only — the one OS it has ever been built
  # or verified on. Other platforms can build it from source.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf
      - name: Build desktop app
        run: cargo build --release -p atlas-tauri
      - name: Package
        run: |
          cd target/release
          printf 'Atlas desktop app (Linux x86_64) %s\n\nRun: ./atlas-tauri\n\nRequires the webkit2gtk 4.1 and GTK 3 runtime libraries, e.g.\n  Debian/Ubuntu: sudo apt install libwebkit2gtk-4.1-0 libgtk-3-0\n  Fedora:        sudo dnf install webkit2gtk4.1 gtk3\n  Arch:          sudo pacman -S webkit2gtk-4.1\n\nLocal-first: the app never calls the network.\n' "$GITHUB_REF_NAME" > DESKTOP-README.txt
          tar czf atlas-desktop-linux-x86_64.tar.gz atlas-tauri DESKTOP-README.txt
          shasum -a 256 atlas-desktop-linux-x86_64.tar.gz > atlas-desktop-linux-x86_64.tar.gz.sha256
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atlas-desktop-linux-x86_64
          path: |
            target/release/atlas-desktop-linux-x86_64.tar.gz
            target/release/atlas-desktop-linux-x86_64.tar.gz.sha256

  release:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.tar.gz
            **/*.tar.gz.sha256
            **/*.zip
            **/*.zip.sha256
          generate_release_notes: true
