[workspace]
members = [
    "crates/atlas-core",
    "crates/atlas-parser",
    "crates/atlas-cli",
    "crates/atlas-index",
    "crates/atlas-embed",
    "crates/atlas-scan",
    "crates/atlas-tauri",
]
resolver = "2"

[workspace.dependencies]
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
