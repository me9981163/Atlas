[package]
name = "atlas-embed"
version = "0.1.0"
edition = "2021"
description = "Local semantic embedding model management for Atlas"
license = "MIT OR Apache-2.0"
repository = "https://github.com/me9981163/Atlas"
readme = "../../README.md"
keywords = ["code", "embeddings", "semantic-search", "model2vec"]
categories = ["development-tools"]
publish = false

[dependencies]
dirs = "7"
model2vec-rs = { version = "0.3", default-features = false, features = [
    "local-only",
    "fancy-regex",
] }
serde = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }

[dev-dependencies]
tempfile = "3.10"
