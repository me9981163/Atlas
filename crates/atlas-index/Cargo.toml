[package]
name = "atlas-index"
version = "0.1.0"
edition = "2021"
description = "Atlas code indexing toolkit"
license = "MIT OR Apache-2.0"
repository = "https://github.com/me9981163/Atlas"
readme = "../../README.md"
keywords = ["code", "index", "graph", "symbols"]
categories = ["development-tools"]
publish = false

[dependencies]
atlas-core = { path = "../atlas-core" }
blake3 = "1"
rusqlite = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
